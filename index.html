<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f0f0f; color: white; text-align: center; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* ЭКРАНЫ */
        .screen { display: none; padding-bottom: 100px; animation: fadeIn 0.3s ease-out; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ГЛАВНОЕ МЕНЮ */
        .main-menu { display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 70vh; padding: 20px; }
        .menu-btn { 
            padding: 25px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; color: white; 
            transition: transform 0.1s, box-shadow 0.2s; position: relative; overflow: hidden;
        }
        .menu-btn:active { transform: scale(0.96); }
        .btn-allies { background: linear-gradient(135deg, #2980b9, #3498db); box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3); }
        .btn-enemies { background: linear-gradient(135deg, #c0392b, #e74c3c); box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3); }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #1a1a1a; position: sticky; top: 0; z-index: 105; border-bottom: 1px solid #333; }
        .back-btn { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .back-btn:active { background: #555; }

        /* ВЫБОР РОЛЕЙ */
        .role-selector { display: grid; gap: 10px; padding: 15px; }
        .role-row { 
            display: flex; align-items: center; background: #1a1a1a; padding: 12px; border-radius: 10px; border: 1px solid #333; 
            justify-content: space-between; transition: background 0.2s;
        }
        .role-row:active { background: #252525; }
        .role-num { font-size: 20px; font-weight: bold; color: #3498db; margin-right: 15px; }
        .role-hero-img { width: 60px; height: 34px; background: #000; border-radius: 4px; background-size: cover; border: 1px solid #444; }

        /* СЕТКА ГЕРОЕВ */
        .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; padding: 10px; }
        .hero-card { 
            cursor: pointer; border: 2px solid #2c3e50; border-radius: 4px; overflow: hidden; background: #1a1a1a; 
            transition: transform 0.1s, border-color 0.2s;
        }
        .hero-card:active { transform: scale(0.9); }
        .hero-card img { width: 100%; display: block; }
        .hero-card.selected { border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.5); }
        
        .attr-header { grid-column: 1 / -1; text-align: left; padding: 10px 5px; font-size: 13px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #333; color: #888; }
        .hidden { display: none; }

        /* СЛОТЫ ВРАГОВ (Sticky) */
        .enemy-header-slots { background: #1a1a1a; padding: 10px; border-bottom: 1px solid #333; position: sticky; top: 50px; z-index: 104; }
        .selected-slots { display: flex; justify-content: center; gap: 6px; }
        .slot { width: 50px; height: 28px; border: 1px dashed #555; border-radius: 3px; background-size: cover; transition: all 0.2s; }
        .slot.filled { border: 1px solid #e74c3c; box-shadow: 0 0 5px rgba(231, 76, 60, 0.4); }

        /* ФУТЕР */
        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 15, 15, 0.95); padding: 15px 0; z-index: 100; border-top: 1px solid #333; backdrop-filter: blur(10px); }
        .send-btn { 
            background: #27ae60; color: white; border: none; padding: 14px 45px; border-radius: 30px; 
            font-weight: bold; font-size: 16px; transition: transform 0.1s; 
        }
        .send-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="screen-main" class="screen active">
        <h2 style="margin-top: 40px; color: #aaa;">Dota Draft Helper</h2>
        <div class="main-menu">
            <button class="menu-btn btn-allies" onclick="showScreen('screen-allies')">СОЮЗНИКИ</button>
            <button class="menu-btn btn-enemies" onclick="openHeroPicker('enemies')">ПРОТИВНИКИ</button>
        </div>
        <div class="footer">
            <button class="send-btn" onclick="sendToBot()">✅ АНАЛИЗИРОВАТЬ</button>
        </div>
    </div>

    <div id="screen-allies" class="screen">
        <div class="header-nav">
            <button class="back-btn" onclick="showScreen('screen-main')">← Назад</button>
            <span style="font-weight: bold;">ВАШИ РОЛИ</span>
            <div style="width:50px"></div>
        </div>
        <div class="role-selector">
            <div class="role-row" onclick="openHeroPicker('allies', 1)">
                <div><span class="role-num">1</span>Керри</div>
                <div id="ally-role-1" class="role-hero-img"></div>
            </div>
            <div class="role-row" onclick="openHeroPicker('allies', 2)">
                <div><span class="role-num">2</span>Мид</div>
                <div id="ally-role-2" class="role-hero-img"></div>
            </div>
            <div class="role-row" onclick="openHeroPicker('allies', 3)">
                <div><span class="role-num">3</span>Хард</div>
                <div id="ally-role-3" class="role-hero-img"></div>
            </div>
            <div class="role-row" onclick="openHeroPicker('allies', 4)">
                <div><span class="role-num">4</span>Саппорт</div>
                <div id="ally-role-4" class="role-hero-img"></div>
            </div>
            <div class="role-row" onclick="openHeroPicker('allies', 5)">
                <div><span class="role-num">5</span>Саппорт 5</div>
                <div id="ally-role-5" class="role-hero-img"></div>
            </div>
        </div>
    </div>

    <div id="screen-picker" class="screen">
        <div class="header-nav">
            <button class="back-btn" id="picker-back-btn">← Назад</button>
            <input type="text" id="hero-search" placeholder="Поиск..." oninput="filterHeroes()" 
                   style="flex:1; margin: 0 10px; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: white;">
        </div>
        
        <div id="enemy-slots-container" class="enemy-header-slots hidden">
            <div class="selected-slots">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
        </div>

        <div class="hero-grid" id="grid"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const heroData = {
            "str": { name: "Сила", list: ["Abaddon", "Alchemist", "Axe", "Beastmaster", "Brewmaster", "Bristleback", "Centaur_Warrunner", "Chaos_Knight", "Dawnbreaker", "Doom", "Dragon_Knight", "Earth_Spirit", "Earthshaker", "Elder_Titan", "Huskar", "Kunkka", "Legion_Commander", "Lifestealer", "Mars", "Night_Stalker", "Omniknight", "Primal_Beast", "Pudge", "Slardar", "Spirit_Breaker", "Sven", "Tidehunter", "Timbersaw", "Tiny", "Treant_Protector", "Tusk", "Underlord", "Undying", "Wraith_King", "Largo"] },
            "agi": { name: "Ловкость", list: ["Anti-Mage", "Arc_Warden", "Bloodseeker", "Bounty_Hunter", "Clinkz", "Drow_Ranger", "Ember_Spirit", "Faceless_Void", "Gyrocopter", "Hoodwink", "Juggernaut", "Luna", "Medusa", "Meepo", "Monkey_King", "Morphling", "Naga_Siren", "Phantom_Assassin", "Phantom_Lancer", "Razor", "Riki", "Shadow_Fiend", "Slark", "Sniper", "Spectre", "Templar_Assassin", "Terrorblade", "Troll_Warlord", "Ursa", "Viper", "Weaver", "Kez"] },
            "int": { name: "Интеллект", list: ["Ancient_Apparition", "Bane", "Batrider", "Crystal_Maiden", "Dark_Willow", "Death_Prophet", "Disruptor", "Enchantress", "Grimstroke", "Invoker", "Jakiro", "Keeper_of_the_Light", "Leshrac", "Lich", "Lina", "Lion", "Muerta", "Nature's_Prophet", "Necrophos", "Oracle", "Outworld_Destroyer", "Puck", "Pugna", "Queen_of_Pain", "Rubick", "Shadow_Demon", "Shadow_Shaman", "Silencer", "Skywrath_Mage", "Storm_Spirit", "Tinker", "Warlock", "Witch_Doctor", "Zeus", "Ringmaster"] },
            "uni": { name: "Универсалы", list: ["Broodmother", "Chen", "Clockwerk", "Dark_Seer", "Dazzle", "Enigma", "Io", "Lone_Druid", "Lycan", "Magnus", "Marci", "Mirana", "Nyx_Assassin", "Ogre_Magi", "Pangolier", "Phoenix", "Sand_King", "Snapfire", "Techies", "Vengeful_Spirit", "Venomancer", "Visage", "Void_Spirit", "Windranger", "Winter_Wyvern"] }
        };

        let selectedEnemies = [];
        let selectedAllies = { 1: null, 2: null, 3: null, 4: null, 5: null };
        let currentMode = '';
        let currentRole = null;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-allies') updateAllyRolesUI();
        }

        function openHeroPicker(mode, role = null) {
            currentMode = mode;
            currentRole = role;
            showScreen('screen-picker');
            
            const enemyBar = document.getElementById('enemy-slots-container');
            const backBtn = document.getElementById('picker-back-btn');
            
            if(mode === 'enemies') {
                enemyBar.classList.remove('hidden');
                backBtn.onclick = () => showScreen('screen-main');
                updateEnemySlotsUI();
            } else {
                enemyBar.classList.add('hidden');
                backBtn.onclick = () => showScreen('screen-allies');
            }
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (const key in heroData) {
                const header = document.createElement('div');
                header.className = `attr-header ${key}`;
                header.innerText = heroData[key].name;
                grid.appendChild(header);

                heroData[key].list.forEach(name => {
                    const card = document.createElement('div');
                    card.className = 'hero-card';
                    const isSelected = (currentMode === 'enemies' && selectedEnemies.includes(name)) || 
                                     (currentMode === 'allies' && Object.values(selectedAllies).includes(name));
                    
                    if(isSelected) card.classList.add('selected');

                    card.innerHTML = `<img src="images/${name}.png">`;
                    card.onclick = () => selectHero(name);
                    grid.appendChild(card);
                });
            }
        }

        function selectHero(name) {
            if (currentMode === 'enemies') {
                if (selectedEnemies.includes(name)) {
                    selectedEnemies = selectedEnemies.filter(h => h !== name);
                } else if (selectedEnemies.length < 5) {
                    selectedEnemies.push(name);
                }
                updateEnemySlotsUI();
            } else {
                for (let r in selectedAllies) if(selectedAllies[r] === name) selectedAllies[r] = null;
                selectedAllies[currentRole] = name;
                showScreen('screen-allies');
            }
            renderGrid();
        }

        function updateEnemySlotsUI() {
            const slots = document.querySelectorAll('#enemy-slots-container .slot');
            slots.forEach((s, i) => {
                if(selectedEnemies[i]) {
                    s.style.backgroundImage = `url('images/${selectedEnemies[i]}.png')`;
                    s.classList.add('filled');
                } else {
                    s.style.backgroundImage = 'none';
                    s.classList.remove('filled');
                }
            });
        }

        function updateAllyRolesUI() {
            for (let i = 1; i <= 5; i++) {
                const img = document.getElementById(`ally-role-${i}`);
                img.style.backgroundImage = selectedAllies[i] ? `url('images/${selectedAllies[i]}.png')` : 'none';
            }
        }

        function filterHeroes() {
            const q = document.getElementById('hero-search').value.toLowerCase();
            document.querySelectorAll('.hero-card').forEach(card => {
                const name = card.innerHTML.toLowerCase();
                card.style.display = name.includes(q) ? 'block' : 'none';
            });
        }

        function sendToBot() {
            tg.sendData(JSON.stringify({ enemies: selectedEnemies, allies: selectedAllies }));
        }

        renderGrid();
    </script>
</body>
</html>

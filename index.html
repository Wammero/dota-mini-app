<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; }
        button { padding: 15px; margin: 10px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .hero-btn { background: #2c3e50; }
    </style>
</head>
<body>
    <h1>Dota Draft Helper</h1>
    <p>Выберите героев врага:</p>
    
    <button class="hero-btn" onclick="selectHero('Pudge')">Pudge</button>
    <button class="hero-btn" onclick="selectHero('Axe')">Axe</button>
    <button class="hero-btn" onclick="selectHero('Lion')">Lion</button>

    <hr>
    <button onclick="sendToBot()">✅ ОТПРАВИТЬ В БОТА</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на все окно

        let selectedEnemies = [];

        function selectHero(name) {
            selectedEnemies.push(name);
            alert("Выбран: " + name);
        }

        function sendToBot() {
            let data = {
                user_role: 3, // Для теста захардкодим поз 3
                enemies: selectedEnemies,
                allies: {}
            };
            // Отправляем данные боту (это закроет Mini App)
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        
        /* ПАНЕЛЬ ВЫБРАННЫХ ГЕРОЕВ */
        .selected-container {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            z-index: 102;
            padding: 15px 5px;
            border-bottom: 2px solid #333;
            margin-bottom: 10px;
        }

        .selected-slots {
            display: flex;
            justify-content: center;
            gap: 10px;
            min-height: 45px;
            margin-bottom: 10px;
        }

        .slot {
            width: 60px;
            height: 36px;
            border: 2px dashed #444;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slot.filled { border: 2px solid #3498db; box-shadow: 0 0 8px #3498db; }

        /* ПОИСК */
        .search-container { padding: 5px 0; }
        #hero-search {
            width: 90%;
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #222;
            color: white;
            font-size: 16px;
            outline: none;
        }

        /* СЕТКА ГЕРОЕВ */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 10px;
            padding: 10px;
            margin-bottom: 100px;
        }

        .attr-header { 
            grid-column: 1 / -1; 
            text-align: left; 
            padding: 10px 5px; 
            font-size: 16px; 
            font-weight: bold; 
            text-transform: uppercase; 
            margin-top: 15px; 
        }
        
        .str { color: #ec7063; border-bottom: 1px solid #ec7063; }
        .agi { color: #58d68d; border-bottom: 1px solid #58d68d; }
        .int { color: #5dade2; border-bottom: 1px solid #5dade2; }
        .uni { color: #f5b041; border-bottom: 1px solid #f5b041; }

        .hero-card { 
            cursor: pointer; 
            border: 2px solid #2c3e50; 
            border-radius: 4px; 
            overflow: hidden; 
            background: #1a1a1a; 
            transition: all 0.2s;
        }

        /* ИСПРАВЛЕНО: Теперь картинки видны всегда */
        .hero-card img { 
            width: 100%; 
            display: block; 
            filter: none; 
            opacity: 1; 
        }

        /* Подсветка выбранного героя в сетке */
        .hero-card.selected { 
            border-color: #3498db; 
            box-shadow: 0 0 10px #3498db;
            transform: scale(1.05);
            z-index: 10;
        }

        .hidden { display: none; }
        .hero-name { font-size: 10px; padding: 4px 2px; height: 24px; display: flex; align-items: center; justify-content: center; }

        .footer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #111; 
            padding: 20px 0; 
            z-index: 100; 
            border-top: 1px solid #333; 
        }
        
        #send-btn { 
            background: #27ae60; 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            border-radius: 30px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="selected-container">
        <div class="selected-slots" id="slots">
            <div class="slot" onclick="removeBySlot(0)"></div>
            <div class="slot" onclick="removeBySlot(1)"></div>
            <div class="slot" onclick="removeBySlot(2)"></div>
            <div class="slot" onclick="removeBySlot(3)"></div>
            <div class="slot" onclick="removeBySlot(4)"></div>
        </div>
        <div class="search-container">
            <input type="text" id="hero-search" placeholder="Поиск врага..." oninput="filterHeroes()">
        </div>
    </div>

    <div class="hero-grid" id="grid"></div>

    <div class="footer">
        <button id="send-btn" onclick="sendToBot()">✅ АНАЛИЗИРОВАТЬ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const heroData = {
            "str": { name: "Сила", list: ["Abaddon", "Alchemist", "Axe", "Beastmaster", "Brewmaster", "Bristleback", "Centaur_Warrunner", "Chaos_Knight", "Dawnbreaker", "Doom", "Dragon_Knight", "Earth_Spirit", "Earthshaker", "Elder_Titan", "Huskar", "Kunkka", "Legion_Commander", "Lifestealer", "Mars", "Night_Stalker", "Omniknight", "Primal_Beast", "Pudge", "Slardar", "Spirit_Breaker", "Sven", "Tidehunter", "Timbersaw", "Tiny", "Treant_Protector", "Tusk", "Underlord", "Undying", "Wraith_King", "Largo"] },
            "agi": { name: "Ловкость", list: ["Anti-Mage", "Arc_Warden", "Bloodseeker", "Bounty_Hunter", "Clinkz", "Drow_Ranger", "Ember_Spirit", "Faceless_Void", "Gyrocopter", "Hoodwink", "Juggernaut", "Luna", "Medusa", "Meepo", "Monkey_King", "Morphling", "Naga_Siren", "Phantom_Assassin", "Phantom_Lancer", "Razor", "Riki", "Shadow_Fiend", "Slark", "Sniper", "Spectre", "Templar_Assassin", "Terrorblade", "Troll_Warlord", "Ursa", "Viper", "Weaver", "Kez"] },
            "int": { name: "Интеллект", list: ["Ancient_Apparition", "Bane", "Batrider", "Crystal_Maiden", "Dark_Willow", "Death_Prophet", "Disruptor", "Enchantress", "Grimstroke", "Invoker", "Jakiro", "Keeper_of_the_Light", "Leshrac", "Lich", "Lina", "Lion", "Muerta", "Nature's_Prophet", "Necrophos", "Oracle", "Outworld_Destroyer", "Puck", "Pugna", "Queen_of_Pain", "Rubick", "Shadow_Demon", "Shadow_Shaman", "Silencer", "Skywrath_Mage", "Storm_Spirit", "Tinker", "Warlock", "Witch_Doctor", "Zeus", "Ringmaster"] },
            "uni": { name: "Универсалы", list: ["Broodmother", "Chen", "Clockwerk", "Dark_Seer", "Dazzle", "Enigma", "Io", "Lone_Druid", "Lycan", "Magnus", "Marci", "Mirana", "Nyx_Assassin", "Ogre_Magi", "Pangolier", "Phoenix", "Sand_King", "Snapfire", "Techies", "Vengeful_Spirit", "Venomancer", "Visage", "Void_Spirit", "Windranger", "Winter_Wyvern"] }
        };

        let selectedEnemies = [];
        const grid = document.getElementById('grid');

        // Инициализация сетки
        for (const key in heroData) {
            const header = document.createElement('div');
            header.className = `attr-header ${key}`;
            header.innerText = heroData[key].name;
            header.id = `header-${key}`;
            grid.appendChild(header);

            heroData[key].list.forEach(name => {
                const card = document.createElement('div');
                card.className = 'hero-card';
                card.id = `card-${name}`;
                card.setAttribute('data-name', name.toLowerCase());
                card.setAttribute('data-attr', key);
                card.innerHTML = `<img src="images/${name}.png" alt="${name}"><div class="hero-name">${name.replace(/_/g, ' ')}</div>`;
                card.onclick = () => toggleHero(name);
                grid.appendChild(card);
            });
        }

        function toggleHero(name) {
            if (selectedEnemies.includes(name)) {
                selectedEnemies = selectedEnemies.filter(h => h !== name);
            } else if (selectedEnemies.length < 5) {
                selectedEnemies.push(name);
            }
            updateUI();
        }

        function removeBySlot(index) {
            if (selectedEnemies[index]) {
                selectedEnemies.splice(index, 1);
                updateUI();
            }
        }

        function updateUI() {
            // Сброс всех карточек
            document.querySelectorAll('.hero-card').forEach(card => card.classList.remove('selected'));
            
            // Подсветка выбранных в сетке
            selectedEnemies.forEach(name => {
                const card = document.getElementById(`card-${name}`);
                if (card) card.classList.add('selected');
            });

            // Обновление верхних слотов
            const slots = document.querySelectorAll('.slot');
            slots.forEach((slot, i) => {
                if (selectedEnemies[i]) {
                    slot.style.backgroundImage = `url('images/${selectedEnemies[i]}.png')`;
                    slot.classList.add('filled');
                } else {
                    slot.style.backgroundImage = 'none';
                    slot.classList.remove('filled');
                }
            });
        }

        function filterHeroes() {
            const query = document.getElementById('hero-search').value.toLowerCase().trim();
            document.querySelectorAll('.hero-card').forEach(card => {
                const nameParts = card.getAttribute('data-name').split('_');
                // Также проверяем полное имя на случай имен с дефисом (Anti-Mage)
                const fullName = card.getAttribute('data-name');
                const isMatch = nameParts.some(part => part.startsWith(query)) || fullName.startsWith(query);
                
                isMatch || query === "" ? card.classList.remove('hidden') : card.classList.add('hidden');
            });
            
            // Скрытие пустых заголовков
            for (const key in heroData) {
                const visible = document.querySelectorAll(`.hero-card[data-attr="${key}"]:not(.hidden)`).length;
                document.getElementById(`header-${key}`).style.display = visible ? 'block' : 'none';
            }
        }

        function sendToBot() {
            if (selectedEnemies.length === 0) return tg.showAlert("Выберите хотя бы одного врага!");
            tg.sendData(JSON.stringify({ 
                user_role: 3, 
                enemies: selectedEnemies 
            }));
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: white; text-align: center; margin: 0; padding: 0; overflow-x: hidden; }
        
        .screen { display: none; padding-bottom: 120px; animation: fadeIn 0.2s ease-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ГЛАВНОЕ МЕНЮ */
        .main-menu { display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 75vh; padding: 20px; box-sizing: border-box; }
        .menu-btn { padding: 25px; border-radius: 12px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; color: white; transition: transform 0.1s; }
        .menu-btn:active { transform: scale(0.96); }
        .btn-allies { background: linear-gradient(135deg, #2980b9, #3498db); box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3); }
        .btn-enemies { background: linear-gradient(135deg, #c0392b, #e74c3c); box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3); }

        /* НАВИГАЦИЯ */
        .header-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #1a1a1a; position: sticky; top: 0; z-index: 105; border-bottom: 1px solid #333; height: 50px; box-sizing: border-box; }
        .back-btn { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* СПИСОК РОЛЕЙ */
        .role-selector { display: grid; gap: 10px; padding: 15px; }
        .role-row { 
            display: flex; align-items: center; background: #1a1a1a; padding: 10px 12px; border-radius: 10px; 
            border: 1px solid #333; justify-content: space-between; min-height: 65px; position: relative;
            transition: opacity 0.3s;
        }
        .role-row.my-role { border-color: #f1c40f; box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.1); background: #1e1b0a; }
        
        .role-left { display: flex; align-items: center; cursor: pointer; flex-grow: 1; text-align: left; }
        /* Если роль заблокирована (моя роль) */
        .role-row.my-role .role-left { cursor: default; }

        .role-icon { width: 30px; height: 30px; margin-right: 12px; background-size: contain; background-repeat: no-repeat; background-position: center; }
        .role-text-container { display: flex; flex-direction: column; }
        .role-label { font-size: 14px; font-weight: bold; color: #3498db; }
        .my-label-tag { font-size: 10px; color: #f1c40f; text-transform: uppercase; margin-top: 2px; font-weight: bold; }

        .role-hero-img { 
            width: 70px; height: 40px; background: #000; border-radius: 4px; 
            background-size: contain; background-position: center; background-repeat: no-repeat;
            border: 1px solid #444; margin-left: auto; margin-right: 10px; 
        }
        
        .set-me-btn { background: #444; color: #fff; border: none; font-size: 10px; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; min-width: 60px; }
        .set-me-btn.active { background: #f1c40f; color: #000; font-weight: bold; }

        .clear-role { color: #e74c3c; font-size: 22px; padding: 5px 10px; cursor: pointer; font-weight: bold; }

        /* СЕТКА ГЕРОЕВ */
        .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; padding: 10px; }
        .hero-card { cursor: pointer; border: 2px solid #2c3e50; border-radius: 4px; overflow: hidden; background: #1a1a1a; transition: transform 0.1s; }
        .hero-card:active { transform: scale(0.85); }
        .hero-card img { width: 100%; display: block; pointer-events: none; }
        .hero-card.selected { border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.6); }
        .attr-header { grid-column: 1 / -1; text-align: left; padding: 15px 5px 5px; font-size: 13px; color: #888; border-bottom: 1px solid #333; text-transform: uppercase; }

        /* ВЕРХНИЕ СЛОТЫ ВРАГОВ */
        .enemy-header-slots { background: #1a1a1a; padding: 10px; border-bottom: 1px solid #333; position: sticky; top: 50px; z-index: 104; }
        .selected-slots { display: flex; justify-content: center; gap: 8px; }
        .slot { width: 60px; height: 34px; border: 1px dashed #555; border-radius: 4px; background-size: contain; background-position: center; background-repeat: no-repeat; background-color: #000; }
        .slot.filled { border: 1px solid #e74c3c; }

        .hidden { display: none !important; }
        
        /* ФУТЕР */
        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 15, 15, 0.95); padding: 20px 0; z-index: 110; border-top: 1px solid #333; backdrop-filter: blur(10px); }
        .send-btn { 
            background: #27ae60; color: white; border: none; padding: 15px 50px; border-radius: 30px; 
            font-weight: bold; font-size: 16px; transition: 0.3s; cursor: pointer;
        }
        .send-btn:disabled { background: #222; color: #555; cursor: not-allowed; opacity: 0.6; }
        .send-btn:active:not(:disabled) { transform: scale(0.95); }

        .warning-text { font-size: 11px; color: #e74c3c; margin-top: 8px; min-height: 14px; }
        #hero-search { flex: 1; margin: 0 10px; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; outline: none; }
    </style>
</head>
<body>

    <div id="screen-main" class="screen active">
        <h2 style="margin-top: 40px; color: #eee; letter-spacing: 1px;">DRAFT HELPER</h2>
        <div class="main-menu">
            <button class="menu-btn btn-allies" onclick="showScreen('screen-allies')">СОЮЗНИКИ</button>
            <button class="menu-btn btn-enemies" onclick="openHeroPicker('enemies')">ПРОТИВНИКИ</button>
        </div>
        <div class="footer">
            <button class="send-btn" id="main-send-btn" onclick="sendToBot()" disabled>✅ АНАЛИЗИРОВАТЬ</button>
            <div id="role-warning" class="warning-text">Выберите роль и хотя бы одного героя</div>
        </div>
    </div>

    <div id="screen-allies" class="screen">
        <div class="header-nav">
            <button class="back-btn" onclick="showScreen('screen-main')">← Назад</button>
            <span style="font-weight: bold; color: #3498db;">ВАША КОМАНДА</span>
            <div style="width:60px"></div>
        </div>
        <div class="role-selector" id="role-list"></div>
    </div>

    <div id="screen-picker" class="screen">
        <div class="header-nav">
            <button class="back-btn" id="picker-back-btn">← Назад</button>
            <input type="text" id="hero-search" placeholder="Поиск героя..." oninput="filterHeroes()">
        </div>
        <div id="enemy-slots-container" class="enemy-header-slots hidden">
            <div class="selected-slots" id="enemy-slots-row"></div>
        </div>
        <div class="hero-grid" id="grid"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const heroData = {
            "str": { name: "Сила", list: ["Abaddon", "Alchemist", "Axe", "Beastmaster", "Brewmaster", "Bristleback", "Centaur_Warrunner", "Chaos_Knight", "Dawnbreaker", "Doom", "Dragon_Knight", "Earth_Spirit", "Earthshaker", "Elder_Titan", "Huskar", "Kunkka", "Legion_Commander", "Lifestealer", "Mars", "Night_Stalker", "Omniknight", "Primal_Beast", "Pudge", "Slardar", "Spirit_Breaker", "Sven", "Tidehunter", "Timbersaw", "Tiny", "Treant_Protector", "Tusk", "Underlord", "Undying", "Wraith_King", "Largo"] },
            "agi": { name: "Ловкость", list: ["Anti-Mage", "Arc_Warden", "Bloodseeker", "Bounty_Hunter", "Clinkz", "Drow_Ranger", "Ember_Spirit", "Faceless_Void", "Gyrocopter", "Hoodwink", "Juggernaut", "Luna", "Medusa", "Meepo", "Monkey_King", "Morphling", "Naga_Siren", "Phantom_Assassin", "Phantom_Lancer", "Razor", "Riki", "Shadow_Fiend", "Slark", "Sniper", "Spectre", "Templar_Assassin", "Terrorblade", "Troll_Warlord", "Ursa", "Viper", "Weaver", "Kez"] },
            "int": { name: "Интеллект", list: ["Ancient_Apparition", "Bane", "Batrider", "Crystal_Maiden", "Dark_Willow", "Death_Prophet", "Disruptor", "Enchantress", "Grimstroke", "Invoker", "Jakiro", "Keeper_of_the_Light", "Leshrac", "Lich", "Lina", "Lion", "Muerta", "Nature's_Prophet", "Necrophos", "Oracle", "Outworld_Destroyer", "Puck", "Pugna", "Queen_of_Pain", "Rubick", "Shadow_Demon", "Shadow_Shaman", "Silencer", "Skywrath_Mage", "Storm_Spirit", "Tinker", "Warlock", "Witch_Doctor", "Zeus", "Ringmaster"] },
            "uni": { name: "Универсалы", list: ["Broodmother", "Chen", "Clockwerk", "Dark_Seer", "Dazzle", "Enigma", "Io", "Lone_Druid", "Lycan", "Magnus", "Marci", "Mirana", "Nyx_Assassin", "Ogre_Magi", "Pangolier", "Phoenix", "Sand_King", "Snapfire", "Techies", "Vengeful_Spirit", "Venomancer", "Visage", "Void_Spirit", "Windranger", "Winter_Wyvern"] }
        };

        let selectedEnemies = [];
        let selectedAllies = { 1: null, 2: null, 3: null, 4: null, 5: null };
        let myRole = null; 
        const roleNames = { 1: "Керри", 2: "Мид", 3: "Хард", 4: "Саппорт", 5: "Полная подд." };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-allies') renderAlliesList();
            updateSendButton();
        }

        function openHeroPicker(mode, role = null) {
            // Если пытаемся выбрать героя для своей роли, но она уже выбрана - блокируем (по желанию)
            // Но по ТЗ: "если пометили свою роль, там теперь нельзя выбрать персонажа"
            if (mode === 'allies' && myRole == role) return;

            currentMode = mode;
            currentRole = role;
            document.getElementById('hero-search').value = '';
            showScreen('screen-picker');
            const enemyBar = document.getElementById('enemy-slots-container');
            if(mode === 'enemies') {
                enemyBar.classList.remove('hidden');
                document.getElementById('picker-back-btn').onclick = () => showScreen('screen-main');
                renderEnemySlots();
            } else {
                enemyBar.classList.add('hidden');
                document.getElementById('picker-back-btn').onclick = () => showScreen('screen-allies');
            }
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (const key in heroData) {
                const header = document.createElement('div');
                header.className = 'attr-header';
                header.innerText = heroData[key].name;
                grid.appendChild(header);

                heroData[key].list.forEach(name => {
                    const card = document.createElement('div');
                    card.className = 'hero-card' + (isHeroSelected(name) ? ' selected' : '');
                    card.innerHTML = `<img src="images/${name}.png" data-hero="${name}">`;
                    card.onclick = () => selectHero(name);
                    grid.appendChild(card);
                });
            }
        }

        function isHeroSelected(name) {
            return selectedEnemies.includes(name) || Object.values(selectedAllies).includes(name);
        }

        function selectHero(name) {
            if (currentMode === 'enemies') {
                if (selectedEnemies.includes(name)) {
                    selectedEnemies = selectedEnemies.filter(h => h !== name);
                } else if (selectedEnemies.length < 5) {
                    if (Object.values(selectedAllies).includes(name)) return;
                    selectedEnemies.push(name);
                }
                renderEnemySlots();
            } else {
                if (selectedEnemies.includes(name)) return;
                for (let r in selectedAllies) if(selectedAllies[r] === name) selectedAllies[r] = null;
                selectedAllies[currentRole] = name;
                showScreen('screen-allies');
            }
            renderGrid();
            updateSendButton();
        }

        function renderEnemySlots() {
            const row = document.getElementById('enemy-slots-row');
            row.innerHTML = '';
            for(let i=0; i<5; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot' + (selectedEnemies[i] ? ' filled' : '');
                if(selectedEnemies[i]) {
                    slot.style.backgroundImage = `url('images/${selectedEnemies[i]}.png')`;
                    slot.onclick = (e) => { e.stopPropagation(); selectedEnemies.splice(i, 1); renderEnemySlots(); renderGrid(); updateSendButton(); };
                }
                row.appendChild(slot);
            }
        }

        function renderAlliesList() {
            const list = document.getElementById('role-list');
            list.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const hero = selectedAllies[i];
                const isMe = (myRole == i);
                const row = document.createElement('div');
                row.className = 'role-row' + (isMe ? ' my-role' : '');
                
                row.innerHTML = `
                    <div class="role-left" onclick="openHeroPicker('allies', ${i})">
                        <div class="role-icon" style="background-image: url('roles_images/${i}.png')"></div>
                        <div class="role-text-container">
                            <span class="role-label">${roleNames[i]}</span>
                            ${isMe ? '<span class="my-label-tag">Ваша роль (заблокировано)</span>' : ''}
                        </div>
                        <div class="role-hero-img" style="background-image: ${hero ? `url('images/${hero}.png')` : 'none'}"></div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <button class="set-me-btn ${isMe ? 'active' : ''}" onclick="toggleMyRole(event, ${i})">${isMe ? 'Это Я' : 'Это я'}</button>
                        ${hero && !isMe ? `<div class="clear-role" onclick="clearRole(${i})">×</div>` : ''}
                    </div>
                `;
                list.appendChild(row);
            }
        }

        function toggleMyRole(event, i) {
            event.stopPropagation();
            if (myRole == i) {
                myRole = null; // Повторный клик снимает пометку
            } else {
                myRole = i;
            }
            renderAlliesList();
            updateSendButton();
        }

        function updateSendButton() {
            const btn = document.getElementById('main-send-btn');
            const warning = document.getElementById('role-warning');
            
            const anyHeroSelected = selectedEnemies.length > 0 || Object.values(selectedAllies).some(h => h !== null);
            const roleSelected = myRole !== null;

            if (roleSelected && anyHeroSelected) {
                btn.disabled = false;
                warning.innerText = "";
            } else {
                btn.disabled = true;
                if (!roleSelected && !anyHeroSelected) warning.innerText = "Выберите роль и героя";
                else if (!roleSelected) warning.innerText = "Укажите свою роль";
                else warning.innerText = "Выберите хотя бы одного героя";
            }
        }

        function clearRole(roleNum) {
            selectedAllies[roleNum] = null;
            renderAlliesList();
            renderGrid();
            updateSendButton();
        }

        function filterHeroes() {
            const q = document.getElementById('hero-search').value.toLowerCase().trim();
            document.querySelectorAll('.hero-card').forEach(card => {
                const heroName = card.querySelector('img').getAttribute('data-hero').toLowerCase().replace('_', ' ');
                card.classList.toggle('hidden', q !== "" && !heroName.includes(q));
            });
        }

        function sendToBot() {
            tg.sendData(JSON.stringify({ 
                enemies: selectedEnemies, 
                allies: selectedAllies,
                myRole: myRole 
            }));
        }

        renderGrid();
    </script>
</body>
</html>

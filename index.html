<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 10px; }
        
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 10px;
            padding: 10px;
            margin-bottom: 100px;
        }

        .attr-header {
            grid-column: 1 / -1;
            text-align: left;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            margin-top: 15px;
            display: flex;
            align-items: center;
        }

        /* Цвета атрибутов как в игре */
        .str { color: #ec7063; }
        .agi { color: #58d68d; }
        .int { color: #5dade2; }
        .uni { color: #f5b041; }

        .hero-card {
            cursor: pointer;
            border: 2px solid #2c3e50;
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.2s;
            background: #1a1a1a;
        }

        .hero-card img {
            width: 100%;
            display: block;
            filter: grayscale(40%);
        }

        .hero-card.selected {
            border-color: #3498db;
            box-shadow: 0 0 10px #3498db;
            transform: translateY(-3px);
        }

        .hero-card.selected img {
            filter: grayscale(0%);
        }

        .hero-name {
            font-size: 10px;
            padding: 3px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            padding: 20px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }

        #send-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Dota Draft Helper</h1>
    <p id="counter">Выбрано врагов: 0 / 5</p>
    
    <div class="hero-grid" id="grid"></div>

    <div class="footer">
        <button id="send-btn" onclick="sendToBot()">✅ АНАЛИЗИРОВАТЬ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Герои, разделенные по атрибутам
        const heroData = {
            "str": {
                name: "Сила",
                list: ["Abaddon", "Alchemist", "Axe", "Beastmaster", "Brewmaster", "Bristleback", "Centaur_Warrunner", "Chaos_Knight", "Dawnbreaker", "Doom", "Dragon_Knight", "Earth_Spirit", "Earthshaker", "Elder_Titan", "Huskar", "Kunkka", "Legion_Commander", "Lifestealer", "Mars", "Night_Stalker", "Omniknight", "Primal_Beast", "Pudge", "Slardar", "Spirit_Breaker", "Sven", "Tidehunter", "Timbersaw", "Tiny", "Treant_Protector", "Tusk", "Underlord", "Undying", "Wraith_King"]
            },
            "agi": {
                name: "Ловкость",
                list: ["Anti-Mage", "Arc_Warden", "Bloodseeker", "Bounty_Hunter", "Clinkz", "Drow_Ranger", "Ember_Spirit", "Faceless_Void", "Gyrocopter", "Hoodwink", "Juggernaut", "Luna", "Medusa", "Meepo", "Monkey_King", "Morphling", "Naga_Siren", "Phantom_Assassin", "Phantom_Lancer", "Razor", "Riki", "Shadow_Fiend", "Slark", "Sniper", "Spectre", "Templar_Assassin", "Terrorblade", "Troll_Warlord", "Ursa", "Viper", "Weaver"]
            },
            "int": {
                name: "Интеллект",
                list: ["Ancient_Apparition", "Bane", "Batrider", "Crystal_Maiden", "Dark_Willow", "Death_Prophet", "Disruptor", "Enchantress", "Grimstroke", "Invoker", "Jakiro", "Keeper_of_the_Light", "Leshrac", "Lich", "Lina", "Lion", "Muerta", "Nature's_Prophet", "Necrophos", "Oracle", "Outworld_Destroyer", "Puck", "Pugna", "Queen_of_Pain", "Rubick", "Shadow_Demon", "Shadow_Shaman", "Silencer", "Skywrath_Mage", "Storm_Spirit", "Tinker", "Warlock", "Witch_Doctor", "Zeus"]
            },
            "uni": {
                name: "Универсалы",
                list: ["Broodmother", "Chen", "Clockwerk", "Dark_Seer", "Dazzle", "Enigma", "Io", "Lone_Druid", "Lycan", "Magnus", "Marci", "Mirana", "Nyx_Assassin", "Ogre_Magi", "Pangolier", "Phoenix", "Sand_King", "Snapfire", "Techies", "Vengeful_Spirit", "Venomancer", "Visage", "Void_Spirit", "Windranger", "Winter_Wyvern"]
            }
        };

        let selectedEnemies = [];
        const grid = document.getElementById('grid');
        const counter = document.getElementById('counter');

        // Отрисовка
        for (const key in heroData) {
            // Добавляем заголовок группы
            const header = document.createElement('div');
            header.className = `attr-header ${key}`;
            header.innerText = heroData[key].name;
            grid.appendChild(header);

            // Добавляем героев группы
            heroData[key].list.forEach(name => {
                const card = document.createElement('div');
                card.className = 'hero-card';
                const displayName = name.replace(/_/g, ' ');

                card.innerHTML = `
                    <img src="images/${name}.png" alt="${name}" loading="lazy">
                    <div class="hero-name">${displayName}</div>
                `;
                
                card.onclick = () => {
                    if (card.classList.contains('selected')) {
                        card.classList.remove('selected');
                        selectedEnemies = selectedEnemies.filter(h => h !== name);
                    } else if (selectedEnemies.length < 5) {
                        card.classList.add('selected');
                        selectedEnemies.push(name);
                    }
                    counter.innerText = `Выбрано врагов: ${selectedEnemies.length} / 5`;
                };
                grid.appendChild(card);
            });
        }

        function sendToBot() {
            if (selectedEnemies.length === 0) {
                tg.showAlert("Выбери хотя бы одного врага!");
                return;
            }
            tg.sendData(JSON.stringify({
                user_role: 3, 
                enemies: selectedEnemies,
                allies: {}
            }));
        }
    </script>
</body>
</html>
